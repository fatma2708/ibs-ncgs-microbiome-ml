name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t ibs-ncgs-ml .
      - name: Run synthetic-data test in container
        run: docker run --rm --entrypoint bash ibs-ncgs-ml tests/test_pipeline.sh
